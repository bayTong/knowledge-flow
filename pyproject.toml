[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeflow-capture"
version = "0.1.0.dev0"
description = "Governed local capture kernel for KnowledgeFlow"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "PyYAML==6.0.3",
]

[project.scripts]
knowledgeflow-capture = "knowledgeflow_capture.cli:main"
knowledgeflow-capture-admin = "knowledgeflow_capture.management_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["knowledgeflow_capture*"]
